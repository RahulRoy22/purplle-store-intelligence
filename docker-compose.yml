services:

  seed:
    image: python:3.11-slim
    volumes:
      - ./data/mock:/data/mock
      - ./data/generated:/data/generated
    # No `pip install` step: the generators use only the Python stdlib
    # (random/uuid), so the seed service needs no network access at startup.
    # Order matters — events are generated BEFORE POS so the POS generator can
    # place transactions inside real billing-queue windows (computed conversion).
    command: >
      sh -c "python /data/mock/generate_store_layout.py &&
             python /data/mock/generate_sample_events.py &&
             python /data/mock/generate_pos_transactions.py &&
             echo '[seed] Done.'"

  api:
    build:
      # Context is the project root so the test stage can COPY tests/ and pytest.ini
      context: .
      dockerfile: services/api/Dockerfile
      # "production" stage: lean image, no test code, no pytest.
      # Use "test" target locally to run the test suite inside the container.
      target: production
    ports:
      - "8000:8000"
    volumes:
      - ./data/generated:/data/generated
      - db_data:/data
      # Mount the real organiser-provided dataset as read-only.
      # The API lifespan ingests pos_transactions.csv on startup via POS_CSV_PATH.
      - ./data/resource:/data/resource:ro
    environment:
      - DB_PATH=/data/store_intelligence.db
      - LOG_LEVEL=INFO
      - STORE_ID=STORE_BLR_002
      - STALE_FEED_THRESHOLD_MINUTES=10
      # Switch from the mock CSV to the real organiser-provided POS data.
      # Comment out or set to "" to fall back to the seeded mock data.
      - POS_CSV_PATH=/data/resource/pos_transactions.csv
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
