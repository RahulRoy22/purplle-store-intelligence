services:

  seed:
    image: python:3.11-slim
    volumes:
      - ./data/mock:/data/mock
      - ./data/generated:/data/generated
    command: >
      sh -c "pip install faker --quiet &&
             python /data/mock/generate_store_layout.py &&
             python /data/mock/generate_pos_transactions.py &&
             python /data/mock/generate_sample_events.py &&
             echo '[seed] Done.'"

  api:
    build:
      # Context is the project root so the test stage can COPY tests/ and pytest.ini
      context: .
      dockerfile: services/api/Dockerfile
      # "test" stage: includes tests/ directory and pytest.
      # Swap to "production" before a real deployment to strip test code.
      target: test
    ports:
      - "8000:8000"
    volumes:
      - ./data/generated:/data/generated
      - db_data:/data
    environment:
      - DB_PATH=/data/store_intelligence.db
      - LOG_LEVEL=INFO
      - STORE_ID=store_001
      - STALE_FEED_THRESHOLD_MINUTES=10
      - POS_CSV_PATH=/data/generated/pos_transactions.csv
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
